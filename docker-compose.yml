version: '3.8'

services:
  # Main application
  app:
    build: .
    container_name: voice-platform-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/voice-platform
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - voice-network
    restart: unless-stopped

  # MongoDB database
  mongodb:
    image: mongo:6
    container_name: voice-platform-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secure-password
      - MONGO_INITDB_DATABASE=voice-platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - voice-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: voice-platform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - voice-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: voice-platform-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - voice-network
    restart: unless-stopped

networks:
  voice-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
